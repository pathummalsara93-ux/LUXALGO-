<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUEEN JUSMY MINI 🧚‍♀️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #9d50bb;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #020205;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a0b2e 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #002d5e 0%, transparent 40%);
            z-index: -1;
        }

        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            animation: moveBg 50s linear infinite;
        }

        @keyframes moveBg {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        .main-card {
            position: relative;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 35px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .crown-icon {
            font-size: 50px;
            background: linear-gradient(45deg, #00d2ff, #9d50bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.5));
            animation: float 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        h2 { font-weight: 800; letter-spacing: 2px; font-size: 22px; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { font-size: 10px; color: #aaa; letter-spacing: 4px; margin-bottom: 25px; }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 15px;
            color: #fff;
            outline: none;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.4);
            filter: brightness(1.1);
        }

        #status { margin-top: 20px; font-weight: 600; min-height: 40px; }

        .pair-code {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed var(--primary);
            letter-spacing: 8px;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
            100% { transform: scale(1); }
        }

        .clock-box {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="particles"></div>

    <div class="main-card">
        <div class="crown-icon"><i class="fa-solid fa-crown"></i></div>
        <h2>𝐐ᴜᴇᴇɴ 𝐉ᴜꜱᴍʏ 𝐌ɪɴɪ</h2>
        <p class="subtitle">PREMIUM BOT PAIRING</p>
        
        <p style="font-size: 13px; color: #ccc; margin-bottom: 20px;">
            <i class="fa-solid fa-shield-halved"></i> Secure Link Protocol
        </p>

        <div class="input-group">
            <input type="number" id="number" placeholder="947xxxxxxxx">
        </div>

        <button id="submit">Get Pairing Code</button>

        <div id="status"></div>

        <div class="clock-box">
            <i class="fa-regular fa-clock"></i> <span id="uptime">00:00:00 AM</span>
        </div>

        <p style="margin-top: 20px; font-size: 10px; color: #555; letter-spacing: 2px;">
            MADE BY SANDESH X PATHUM
        </p>
    </div>

    <script>
        // Live Modern Clock
        function updateTime() {
            const now = new Date();
            document.getElementById("uptime").textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        const statusDiv = document.getElementById("status");
        const submitBtn = document.getElementById("submit");
        const numberInput = document.getElementById("number");

        submitBtn.addEventListener("click", async () => {
            let num = numberInput.value.trim();
            
            // Clean the number (remove + or spaces)
            num = num.replace(/[^0-9]/g, "");

            if (!num || num.length < 10) {
                statusDiv.innerHTML = '<span style="color: #ff4b2b;">Invalid Phone Number!</span>';
                return;
            }

            // Loading UI State
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.innerText = "Connecting...";
            statusDiv.innerHTML = '<div style="color: #00d2ff;"><i class="fa-solid fa-spinner fa-spin"></i> Initializing Session...</div>';

            try {
                // FIXED: Connecting to your Heroku Backend
                const response = await fetch(`https://jusmy-mini-pro-9f3373cc5b2f.herokuapp.com/code?number=${num}`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.code) {
                    statusDiv.innerHTML = `
                        <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Click code to copy</p>
                        <div class="pair-code" id="pairCode" onclick="copyCode()">${data.code}</div>
                    `;
                } else {
                    statusDiv.innerHTML = '<span style="color: #ff4b2b;">Session Failed. Please try again!</span>';
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = '<span style="color: #ff4b2b;">API Error! Is Heroku sleeping?</span>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.innerText = "Get Pairing Code";
            }
        });

        async function copyCode() {
            const pc = document.getElementById("pairCode");
            if(!pc) return;

            const codeText = pc.innerText;
            try {
                await navigator.clipboard.writeText(codeText);
                const originalText = pc.innerText;
                pc.innerText = "COPIED!";
                pc.style.color = "#00ff88";
                pc.style.borderColor = "#00ff88";
                
                setTimeout(() => {
                    pc.innerText = originalText;
                    pc.style.color = "#fff";
                    pc.style.borderColor = "#00d2ff";
                }, 1500);
            } catch (err) {
                alert("Failed to copy: " + codeText);
            }
        }
    </script>
</body>
</html>
