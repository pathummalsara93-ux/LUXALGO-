<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXALGO OFFICIAL</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', sans-serif;
  background:#0a0014;
  color:#ddd;
  overflow-x:hidden;
}

/* BACKGROUND */
#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* HEADER */
header {
  text-align:center;
  padding:30px 15px;
  font-size:32px;
  font-weight:bold;
  color:#caa6ff;
  text-shadow:0 0 15px #a855f7;
}

/* SCROLL TEXT */
.scrolling-text {
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  border:1px solid rgba(200,120,255,.6);
  padding:10px;
  margin:20px auto;
  background:rgba(60,20,90,0.4);
  border-radius:15px;
}
.scrolling-text span {
  display:inline-block;
  padding-left:100%;
  animation: scrollText 22s linear infinite;
  color:#d9b3ff;
}
@keyframes scrollText {
  from { transform:translateX(100%); }
  to { transform:translateX(-100%); }
}

/* SERVICES */
.services {
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.service-box {
  width:100%;
  max-width:600px;
  background:
    linear-gradient(rgba(20,0,40,0.75), rgba(20,0,40,0.75)),
    url("https://img.sanishtech.com/u/012a40af5a9cc3aa46b9c4bd3f35f1b2.gif");
  background-size:cover;
  background-position:center;
  padding:45px 30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 0 40px rgba(180,120,255,0.6);
}

.service-box h3 {
  font-size:30px;
  color:#e8c9ff;
  margin-bottom:15px;
}

.service-box p {
  font-size:16px;
  color:#ddd;
  margin-bottom:25px;
}

/* BUTTONS UNDER SERVICE */
.service-buttons {
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.service-btn {
  padding:14px 35px;
  border-radius:30px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#7a2cff,#3d0066);
  text-decoration:none;
  box-shadow:0 0 20px #b983ff;
  transition:0.3s;
}

.service-btn:hover {
  transform:scale(1.08);
  box-shadow:0 0 35px #d1a6ff;
}

/* OWNER */
.owner-card {
  margin:50px auto;
  max-width:420px;
  background:rgba(90,50,130,0.35);
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(170,120,255,0.4);
}
.owner-card img {
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid #b58bff;
}
.owner-card h3 {
  margin-top:10px;
  color:#e7c9ff;
}

/* FOOTER */
footer {
  text-align:center;
  padding:20px;
  color:#aaa;
  border-top:1px solid rgba(200,150,255,0.2);
}

/* CANVAS */
canvas {
  position:fixed;
  inset:0;
  z-index:-1;
}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<header>LUXALGO OFFICIAL</header>

<div class="scrolling-text">
  <span>මෙවැනි Website අඩුවට සාදාගැනීමට අදම අපව සම්බන්ධ කරගන්න • Premium Design • Fast Delivery</span>
</div>

<section class="services">
  <div class="service-box">
    <h3>OUR SERVICES</h3>
    <p>Web Development • Bot Systems • Automation • UI Design</p>

    <div class="service-buttons">
      <a href="https://lt-film.vercel.app/" class="service-btn">🎬 Movie Request</a>
      <a href="https://wa.me/94773416478" class="service-btn">👤 Contact Owner</a>
    </div>
  </div>
</section>

<div class="owner-card">
  <img src="https://img.sanishtech.com/u/973f0d65e48f88b41b9414e2756eab05.jpg">
  <h3>Pathum Malsara</h3>
  <p>Founder & Developer</p>
</div>

<footer>
  © 2026 LUXALGO OFFICIAL — All Rights Reserved
</footer>

<script>
const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const dots = Array.from({length:120},()=>({
  x:Math.random()*w,
  y:Math.random()*h,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.4,
  dy:(Math.random()-0.5)*0.4
}));

function animate(){
  ctx.clearRect(0,0,w,h);
  dots.forEach(d=>{
    d.x+=d.dx; d.y+=d.dy;
    if(d.x<0||d.x>w) d.dx*=-1;
    if(d.y<0||d.y>h) d.dy*=-1;
    ctx.fillStyle="rgba(170,120,255,0.6)";
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
